<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search & Sort Paintings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Acme Art Gallery</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="painting_listing.html">Browse Paintings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="insert_update_delete.html">Manage Paintings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="search_and_sort.html">Search & Sort</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Search and Sort Section -->
    <div class="container my-5">
        <h2 class="text-center mb-4">Search & Sort Paintings</h2>
        
        <!-- Search and Sort Form -->
        <form id="searchForm" class="mb-4">
            <div class="row">
                <div class="col-md-4">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by title or artist...">
                </div>
                <div class="col-md-4">
                    <select id="sortSelect" class="form-control">
                        <option value="">Sort By</option>
                        <option value="year_asc">Year (Ascending)</option>
                        <option value="year_desc">Year (Descending)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary">Search & Sort</button>
                </div>
            </div>
        </form>

        <!-- Paintings Listing -->
        <div id="paintingsContainer" class="row">
            <!-- Dynamic content will be inserted here -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center py-4">
        <p>&copy; 2024 Acme Art Gallery. All rights reserved.</p>
    </footer>

    <script src="assets/js/search_and_sort.js"></script>
</body>
</html>
